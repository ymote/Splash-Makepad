[package]
name = "flutter-samples"
version = "0.1.0"
edition = "2021"
description = "The flutter/samples catalog rendered as native makepad widgets from the Splash DSL"

[dependencies]
makepad-widgets = { path = "../../../makepad-splash/widgets" }
splash-widgets = { path = "../../crates/splash-widgets" }
splash-render = { path = "../../crates/splash-render" }
splash-makepad = { path = "../../crates/splash-makepad" }

# A cdylib for the OpenHarmony and Android builds, an rlib so the desktop binary
# below can link it, and the binary itself for `cargo run`.
[lib]
name = "flutter_samples"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flutter-samples"
path = "src/main.rs"
