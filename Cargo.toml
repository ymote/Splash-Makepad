# Splash-Makepad — themed component kits on the Splash DSL + makepad renderer.
[workspace]
resolver = "2"
members = [
    "crates/splash-render",
    "crates/splash-makepad",
    "crates/splash-widgets",
    "apps/kit-host",
    "apps/flutter-samples",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
